*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button[disabled]{cursor:not-allowed}h1,h2,h3,p,dl,dd{margin:0}h1,h2{font-family:var(--serif);font-weight:400;line-height:1.13;letter-spacing:-.035em}h1{font-size:clamp(2rem,3.5vw,3.2rem)}h2{font-size:clamp(1.25rem,2.25vw,1.75rem)}p{color:var(--muted)}svg{flex:none}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,g:focus-visible{outline:2px solid var(--focus);outline-offset:3px}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip{position:absolute;z-index:10;top:6px;left:6px;transform:translateY(-200%)}.skip:focus{transform:none}
.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100dvh}.sidebar{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:23px 16px 14px;scrollbar-width:thin}.brand{display:flex;gap:10px;align-items:center;margin:0 3px 21px;padding:0 1px 19px;border-bottom:1px solid var(--line)}.brand-mark{width:43px;height:43px;display:grid;place-items:center;background:var(--night);color:#ebcb91;border-radius:12px;flex:none}.brand-name{font:400 15.6px/1.15 var(--serif);letter-spacing:-.035em;white-space:nowrap}.brand small{display:block;margin-top:4px;font-size:10px;color:var(--muted);letter-spacing:.025em}.sidebar nav section+section{margin-top:13px}.sidebar nav p{padding:0 10px 4px;font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.10em;text-transform:uppercase}.sidebar nav a{display:flex;gap:9px;align-items:center;min-height:32px;border-radius:8px;padding:5px 9px;color:var(--muted);font-size:12px}.sidebar nav a:hover,.sidebar nav a[aria-current="page"]{color:var(--ink);background:var(--surface)}.sidebar nav a[aria-current="page"]{font-weight:700;box-shadow:inset 2px 0 var(--gold)}.local-label{border-top:1px solid var(--line);margin-top:19px;padding:13px 8px 0;color:var(--muted);display:flex;gap:8px;align-items:center;font-size:11px}
.workspace{min-width:0}.topbar{height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:0 clamp(17px,3vw,46px);background:var(--surface);font-size:12px;color:var(--muted)}.breadcrumb,.top-actions{display:flex;align-items:center;gap:10px}.breadcrumb b{color:var(--ink)}.sample{padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--gold) 23%,var(--surface));color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.035em}.device-status{display:flex;gap:6px;align-items:center}.nav-mask,#mobile-toggle{display:none}.save-warning{margin:12px auto 0;max-width:1080px;padding:12px 18px;background:#e9cc97;color:#322619;border-radius:10px}
.content{max-width:1420px;margin:0 auto;padding:29px clamp(16px,3vw,46px) 45px;outline:none}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 22px}.page-heading p{margin-top:7px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.button,.plain{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;min-height:37px;font-size:12px;font-weight:700;white-space:nowrap}.button:hover{background:var(--paper);border-color:var(--gold)}.button.primary{background:#365666;border-color:#365666;color:#fffdf8}.button.primary:hover{background:#263e4a}.plain{background:transparent;border:0}.square{height:34px;width:34px;min-height:34px;padding:0;border-radius:8px}.square:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}.text-link{font-size:12px;color:var(--blue);font-weight:700;display:inline-flex;gap:6px;align-items:center}.text-link:hover{text-decoration:underline;text-underline-offset:3px}

    <button type="button" id="atelier-signout" hidden>Sign out</button>

    <button type="submit">Join shared workspace</button>
  </form>

      <button type="button" id="atelier-load-cloud" hidden>Load shared version</button>
      <button type="button" id="atelier-leave" hidden>Return to local planner</button>
    </div>
  </div>

function shiftMonth(year,month,delta){
  const index=year*12+month-1+delta;
  const nextYear=Math.floor(index/12);
  return nextYear<MIN_YEAR||nextYear>MAX_YEAR?null:{year:nextYear,month:mod(index,12)+1};
}

function assignment(s,rows,date){
  const exception=rows['Day Exceptions'].filter(({values:[d,p]})=>d===date&&['A','B'].includes(p)).map(r=>r.values[1]).sort();
  const parity=Number(date.slice(0,4))%2?'Odd years':'Even years';
  const holiday=rows['Holidays & Vacations'].filter(({values:[start,end,p,recur]})=>start&&start<=date&&end>=date&&['A','B'].includes(p)&&(recur==='All years'||recur===parity)).map(r=>r.values[2]).sort();
  if(exception.length)return {parent:exception[0],source:'Day exception',conflict:exception.length>1};
  if(holiday.length)return {parent:holiday[0],source:'Holiday',conflict:holiday.length>1};
  const cycle=SCHEMES[s.scheme];
  if(!s.start||!cycle)return {parent:'',source:'Unassigned'};
  const first=s.first==='B'?'B':'A';
  const day=mod(Math.round((asUTC(date)-asUTC(s.start))/DAY),cycle.length);
  return {parent:cycle[day]==='A'?first:first==='A'?'B':'A',source:'Pattern'};
}
function compute(db,year=db.settings.year){
  const {settings:s,rows}=db;
  const rowsWith=Object.fromEntries(Object.entries(rows).map(([name,list])=>[name,list.map(r=>({...r,values:[...r.values]}))]));
  const expenses=rowsWith['Shared Expenses'];
  const repays=rowsWith['Reimbursements'];
  const support=rowsWith['Child Support'];
  const handovers=rowsWith['Handover Log'];
  const groups=new Map(), amounts=new Map(), dueDates=new Map();
  for(const row of expenses){
    const key=String(row.values[0]??'').toUpperCase();
    groups.set(key,[...(groups.get(key)??[]),row]);
  }
  for(const {values:v} of support){
    const key=(v[0]??'').slice(0,7);
    if(v[1])dueDates.set(key,[...(dueDates.get(key)??[]),v[1]]);
  }
  for(const row of repays){
    const v=row.values;
    const key=String(v[1]??'').toUpperCase(), linked=groups.get(key);
    const issue=!v[0]||!v[1]||!number(v[4])?'Missing input':
      !['A','B'].includes(v[2])||!['A','B'].includes(v[3])||v[2]===v[3]?'Check direction':
      linked?.length!==1?'Check expense ID':linked[0].values[7]!=='Yes'?'Expense is not shared':'';
    const signed=issue?null:cents(v[4])*(v[3]==='A'?1:-1);
    if(signed!==null)amounts.set(key,(amounts.get(key)??0)+signed);
    v[7]=signed===null?null:signed/100; v[8]=issue;
  }
  let balance=0;
  for(const row of expenses){
    const v=row.values;
    const key=String(v[0]??'').toUpperCase();
    const issue=!key?'Missing ID':groups.get(key).length!==1?'Duplicate ID':
      !v[1]||!number(v[5])||!['A','B'].includes(v[6])||!['Yes','No'].includes(v[7])?'Missing required input':'';
    if(issue){v[13]='Check input';v[15]=issue;continue;}
    const shared=v[7]==='Yes';
    const total=cents(v[5]);
    const a=shared?cents(Number(v[5])*Number(filled(v[8])?v[8]:s.share)):v[6]==='A'?total:0;
    const b=total-a, debt=v[6]==='A'?b:-a, paid=amounts.get(key)??0, net=debt-paid;
    const status=!shared?'Not shared':net===0?'Reimbursed':debt*net<0?'Overpaid':Math.abs(net)<Math.abs(debt)?'Partly reimbursed':'To reimburse';
    v.splice(10,6,a/100,b/100,paid/100,status,net/100,'');
    balance+=net;
  }
  for(const {values:v} of support){
    const key=(v[0]??'').slice(0,7), due=dueDates.get(key)??[];
    const issue=!key?'Enter period':number(v[4])&&!v[3]?'Enter payment date':number(v[2])&&!v[1]?'Enter due date':v[1]&&due.length>1?'One due date per month':'';
    v[6]=issue||!v[3]||!number(v[4])?'':due.length!==1?'No due date':v[3]>due[0]?'Yes':'No';
    v[7]=issue;
  }
  for(const {values:v} of handovers){
    v[7]=v[0]&&v[1]?timeDelta(v[0],v[1]):null;
    v[8]=!v[0]?'':!v[1]?'Scheduled':v[7]>s.late?'Over threshold':v[7]<0?'Early':'Recorded';
  }
  let running=0;
  const months=Array.from({length:12},(_,i)=>{
    const key=monthKey(year,i+1);
    const count=new Date(Date.UTC(year,i+1,0)).getUTCDate();
    const dates=Array.from({length:count},(_,day)=>assignment(s,rows,key+'-'+pad(day+1)).parent);
    const a=dates.filter(p=>p==='A').length,b=dates.filter(p=>p==='B').length;
    const matches=(list,i)=>list.filter(({values:v})=>v[i]?.startsWith(key));
    const exp=matches(expenses,1).filter(({values:v})=>v[7]==='Yes'&&v[13]!=='Check input');
    const rep=matches(repays,0), sup=matches(support,0).filter(({values:v})=>!v[7]), hand=matches(handovers,0);
    const sum=(list,i)=>list.reduce((acc,{values:v})=>acc+(number(v[i])?cents(v[i]):0),0);
    const due=sum(sup,2),paid=sum(sup,4),gap=due-paid;
    running+=gap;
    return {key,a,b,unassigned:count-a-b,share:a+b?a/(a+b):null,expenses:sum(exp,5)/100,repayments:sum(rep,7)/100,due:due/100,paid:paid/100,gap:gap/100,running:running/100,
      late:hand.filter(({values:v})=>v[8]==='Over threshold').length,lateSupport:sup.some(({values:v})=>v[6]==='Yes')?1:0};
  });
  const annual=Object.fromEntries(['a','b','unassigned','expenses','repayments','due','paid','gap','late','lateSupport'].map(k=>[k,months.reduce((acc,m)=>acc+m[k],0)]));
  return {months,annual,balance:balance/100,rows:rowsWith};
}

function parseField(v,f){
  if(!filled(v))return null;
  if(f.type==='m'||f.type==='f'){
    const n=Number(v);
    if(!Number.isFinite(n)||Math.abs(n)>9999999||(f.type==='f'&&(n<0||n>1)))throw Error('Check '+f.label+'.');
    return n;
  }
  if(typeof v!=='string')throw Error('Check '+f.label+'.');
  if(f.type==='d'||f.type==='t'){
    const re=f.type==='d'?/^\d{4}-\d\d-\d\d$/:/^\d{4}-\d\d-\d\dT(?:[01]\d|2[0-3]):[0-5]\d$/;
    if(!re.test(v)||!Number.isFinite(asUTC(v))||keyOf(asUTC(v))!==v.slice(0,10)||v<'2000-01-01'||v>='2101-01-01')throw Error('Check '+f.label+'.');
  }
  if(f.type==='h'&&!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(v))throw Error('Check '+f.label+'.');
  const opts=choices(f.type);
  if(opts.length&&!opts.includes(v))throw Error('Check '+f.label+'.');
  return v;
}
function choices(type){return type==='p'?['A','B']:type==='y'?['Yes','No']:type.includes('/')?type.split('/'):[];}
function normalise(input){
  if(input?.schema!==1||!input.settings||!input.rows||typeof input.rows!=='object')throw Error('Choose a Family Atelier JSON backup.');
  const s={...initialSettings(),...input.settings};
  const currencies=['USD','GBP','EUR','CAD','AUD','NZD'];
  if(!Number.isInteger(s.year)||s.year<2000||s.year>2100||!Object.hasOwn(SCHEMES,s.scheme)||!currencies.includes(s.currency)||
    !['A','B'].includes(s.first)||!['Monday','Sunday'].includes(s.week)||!(s.month==='Auto'||Number.isInteger(s.month)&&s.month>=1&&s.month<=12)||
    !['light','dark'].includes(s.theme)||![s.parent_a,s.parent_b].every(n=>typeof n==='string'&&n.trim())||![s.share,s.planned].every(n=>typeof n==='number'&&n>=0&&n<=1)||
    !Number.isInteger(s.late)||s.late<0||s.late>1440)throw Error('This backup contains invalid family settings.');
  parseField(s.start,{label:'Pattern start',type:'d'});
  s.colorA=validColor(s.colorA,'#C7826A');s.colorB=validColor(s.colorB,'#7FA38A');
  const clean=emptyRows();
  for(const [name,list] of Object.entries(clean)){
    const seen=new Set();
    if(!Array.isArray(input.rows[name]))throw Error('A register is missing from the backup.');
    for(const r of input.rows[name]){
      if(!r||typeof r.id!=='string'||seen.has(r.id)||!Array.isArray(r.values))throw Error('A record in '+name+' is invalid.');
      seen.add(r.id);
      list.push({id:r.id,values:fields[name].filter(f=>f.type!=='=').map(f=>parseField(r.values[f.i],f))});
    }
  }
  return {schema:1,edition:input.edition==='SAMPLE'?'SAMPLE':'BLANK',settings:s,rows:clean};
}

function localInfo(){
  const date=todayKey(), now=nowKey(), last=addDays(date,6), upcoming=[], reminders=[];
  const between=(d,end)=>d&&d>=date&&d<=end;
  for(const [name,idx] of [['Medical & Health',3],['School & Activities',3]]){
    for(const {values:v} of db.rows[name]){
      if(v[2]==='Medication'){
        if(v[0]===date||v[0]&&v[0]<date&&v[9]>=date)reminders.push({title:v[idx],detail:[v[1],v[4]].filter(Boolean).join(' · '),name});
      }else if(between(v[0],last))upcoming.push({date:v[0],time:v[4],title:v[idx],detail:v[1],name});
    }
  }
  const handovers=db.rows['Handover Log'].filter(({values:v})=>v[0]>=now&&!v[1]).sort((a,b)=>a.values[0].localeCompare(b.values[0]));
  for(const {values:v} of handovers){
    const d=v[0].slice(0,10);
    if(between(d,last))upcoming.push({date:d,time:v[0].slice(11),title:'Scheduled handover',detail:v[4],name:'Handover Log'});
  }
  for(const {values:v} of db.rows['Children Profiles']){
    if(between(v[9],addDays(date,30)))reminders.push({title:v[8]||'Document renewal',detail:displayDate(v[9]),name:'Children Profiles'});
    if(v[1]){
      const month=v[1].slice(5,7),day=v[1].slice(8,10);
      const birthday=y=>keyOf(Date.UTC(y,Number(month)-1,Number(day)));
      const y=Number(date.slice(0,4));
      const next=birthday(y)>=date?birthday(y):birthday(y+1);
      if(between(next,addDays(date,30)))reminders.push({title:(v[0]||'Child')+'’s birthday',detail:displayDate(next),name:'Children Profiles'});
    }
  }
  const old=snapshot.rows['Shared Expenses'].filter(({values:v})=>v[1]&&v[1]<addDays(date,-30)&&['To reimburse','Partly reimbursed'].includes(v[13])).length;
  if(old)reminders.push({title:old+' expense'+(old===1?'':'s')+' open over 30 days',detail:'Shared expenses',name:'Shared Expenses'});
  return {date,upcoming:upcoming.sort((a,b)=>(a.date+(a.time??'')).localeCompare(b.date+(b.time??''))),reminders,next:handovers[0]?.values};
}

function calendarGrid(month,compact=false){

  const today=todayKey();
  const cellCount=compact?Math.ceil((count+offset)/7)*7:42;

    const d=i-offset+1;
    if(d<1||d>count)return '<span class="cal-day void" aria-hidden="true"></span>';
    const k=key+'-'+pad(d), a=assignment(db.settings,db.rows,k);
    const cl='cal-day '+(a.parent?'parent-'+a.parent.toLowerCase():'')+(k===today?' today':'');

function displayValue(n,f,v){
  if(!filled(v))return '<span class="muted">—</span>';
  if(f.type==='p')return badge(v);
  if(f.type==='d')return esc(displayDate(v));
  if(f.type==='t')return esc(displayDate(v)+' · '+v.slice(11));
  if(f.type==='m'||currencyCols[n]?.includes(f.i))return esc(money(v));
  if(f.type==='f')return esc(percent(v));
  if(f.label==='Status'||f.label==='Check'){
    const tone=['Reimbursed','Recorded'].includes(v)?'good':['To reimburse','Partly reimbursed','Scheduled'].includes(v)?'warn':['Overpaid','Over threshold','Check input'].includes(v)||f.label==='Check'?'alert':'plain-status';
    return '<span class="status '+tone+'">'+esc(v)+'</span>';
  }
  return esc(v);
}

function matchingRows(n){
  const search=filter.trim().toLowerCase(), d=dateField[n], title=mainField[n];
  const list=snapshot.rows[n].filter(r=>!search||r.values.some(v=>filled(v)&&String(v).toLowerCase().includes(search))||
    fields[n].some(f=>f.type==='p'&&r.values[f.i]&&parentName(r.values[f.i]).toLowerCase().includes(search)));
  const compare=(a,b,i)=>String(a.values[i]??'').localeCompare(String(b.values[i]??''));
  if(order==='name')return list.sort((a,b)=>compare(a,b,title));
  if(d===undefined)return order==='oldest'?list:list.reverse();
  return list.sort((a,b)=>order==='oldest'?compare(a,b,d):compare(b,a,d));

function csvEscape(value){
  let v=String(value??'');
  if(typeof value==='string'&&/^'*(?:\s*[=+\-@]|[\t\r\n])/.test(v))v="'"+v;
  return '"'+v.replace(/"/g,'""')+'"';
}
function csvExport(n){
  const fs=fields[n].filter(f=>f.type!=='=');
  const header=fs.map(f=>csvEscape(f.label)).join(',');
  const body=db.rows[n].map(r=>fs.map(f=>csvEscape(r.values[f.i])).join(','));
  download(slug(n)+'.csv','\ufeff'+[header,...body].join('\r\n'),'text/csv;charset=utf-8');
}
function parseCSV(text){
  const rows=[];
  let row=[],v='',quoted=false,closed=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){
      if(c==='"'&&text[i+1]==='"'){v+='"';i++;}
      else if(c==='"'){quoted=false;closed=true;}
      else v+=c;
    }else if(c===','||c==='\n'||c==='\r'){
      row.push(v);v='';closed=false;
      if(c!==','){rows.push(row);row=[];if(c==='\r'&&text[i+1]==='\n')i++;}
    }else if(c==='"'&&!v&&!closed)quoted=true;
    else{
      if(closed||c==='"')throw Error('Invalid CSV quoting.');
      v+=c;
    }
  }
  if(quoted)throw Error('Invalid CSV quoting.');
  if(v||row.length||closed){row.push(v);rows.push(row);}
  return rows;
}
function chooseFile(kind,n){
  pendingFile={kind,n};
  const input=document.querySelector('#file');

document.querySelector('#file').addEventListener('change',async event=>{
  const file=event.target.files[0], pending=pendingFile;
  if(!file||!pending)return;
  try{
    if(file.size>10_000_000)throw Error('Choose a backup smaller than 10 MB.');
    const raw=(await file.text()).replace(/^\ufeff/,'');
    if(pending.kind==='json'){
      const next=normalise(JSON.parse(raw));
      confirmModal('Restore this backup?','The selected backup will replace the data in this browser.',()=>replaceData(next,'Backup restored.'),'Restore backup');
    }else{
      const n=pending.n, fs=fields[n].filter(f=>f.type!=='=');
      const [head,...lines]=parseCSV(raw);
      if(!head||head.length!==fs.length||fs.some((f,i)=>head[i]!==f.label))throw Error('Column headers differ. Start with a CSV exported from '+n+'.');
      const values=lines.filter(r=>r.some(filled)).map((r,j)=>{
        if(r.length!==fs.length)throw Error('Wrong number of columns on row '+(j+2)+'.');
        return fs.map((f,i)=>{
          const v=r[i].replace(/^'(?='*(?:\s*[=+\-@]|[\t\r\n]))/,'');
          return parseField(v,f);
        });
      });
      if(!values.length)throw Error('The CSV has no records.');
      confirmModal('Import '+values.length+' records?','The records will be added to '+n+'.',()=>{
        db.rows[n].push(...values.map(v=>({id:id(),values:v})));storeDB();render();toast('Records imported.');
      },'Import records');
    }
  }catch(error){toast(error.message||'Could not open this file.');}
});

import('./atelier-cloud.js').then(({installCloud})=>{
  atelierCloud=installCloud({
    key:DATA_KEY,
    read:()=>JSON.stringify(db),
    empty:()=>JSON.stringify(makeDB()),
    canApply:()=>!dialog.open,
    apply(payload){
      const next=normalise(JSON.parse(payload));
      if(dialog.open)dialog.close();
      undo=null;
      db=next;
      snapshot=compute(db,activeYear);
      render();
    },
  });
}).catch(()=>{
  cloudPanel.querySelector('[role=status]').textContent='Firebase could not load. Check your connection and reload this page.';
});
render();
if(firstRun)showWelcome();

if(location.protocol==='https:'||(location.protocol==='http:'&&['localhost','127.0.0.1'].includes(location.hostname))){
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  navigator.serviceWorker?.addEventListener('controllerchange',()=>{const ready=document.querySelector('#offline-ready');if(ready)ready.hidden=!navigator.serviceWorker.controller;});
  document.addEventListener('click',()=>navigator.storage?.persist?.().catch(()=>{}),{once:true});
}
</script></body></html>
